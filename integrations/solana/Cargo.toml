[package]
name = "equity-catalyst-solana"
version = "0.1.0"
edition = "2021"

[lib]
name = "equity_catalyst_solana"
path = "mod.rs"

[dependencies]
solana-sdk = "1.18.26"
zeroize = "=1.3.0"
zeroize_derive = "=1.4.2"
borsh = "=1.5.1"
reqwest = { version = "0.11", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
base64 = "0.21"
sha2 = "0.10"
bs58 = "0.4"
bincode = "1.3"
