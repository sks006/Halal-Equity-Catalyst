[package]
name = "equity-catalyst-jupiter"
version = "0.1.0"
edition = "2021"

[lib]
name = "equity_catalyst_jupiter"
path = "mod.rs"

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
solana-sdk = "1.18.26"
base64 = "0.21"
bincode = "1.3"
equity-catalyst-shared = { path = "../../crates/shared" }
async-trait = "0.1"

