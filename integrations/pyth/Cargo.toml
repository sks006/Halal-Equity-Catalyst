[package]
name = "equity-catalyst-pyth"
version = "0.1.0"
edition = "2021"

[lib]
name = "equity_catalyst_pyth"
path = "mod.rs"

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
equity-catalyst-shared = { path = "../../crates/shared" }
